services:
  - type: web
    name: driving-teaching
    runtime: static
    # The compiled CSS (assets/css/app.css) is committed, so no build step is needed.
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /media/*
        name: Cache-Control
        value: public, max-age=604800
