<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Driving Teaching · A to Z guide from first lesson to test pass</title>
  <meta name="description" content="A to Z driving curriculum with pictures and examples, progress tracking, manoeuvre cheat-sheets, a Show me Tell me trainer and a mock test sheet. For UK driving instructors and their students.">
  <meta name="theme-color" content="#1d5fae">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    (function () {
      var t = 'system';
      try { t = JSON.parse(localStorage.getItem('dt-theme')) || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>
<body class="min-h-dvh bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-50 focus:rounded-lg focus:bg-amber-300 focus:px-3 focus:py-2 focus:text-slate-900">Skip to content</a>

  <div class="lg:grid lg:grid-cols-[260px_1fr] print:block">
    <!-- Sidebar (tablet landscape and desktop) -->
    <aside class="hidden print:hidden lg:flex lg:sticky lg:top-0 lg:h-dvh flex-col border-r border-slate-200 bg-white px-4 py-5 dark:border-slate-800 dark:bg-slate-900" aria-label="Main navigation">
      <a href="#/" class="flex items-center gap-3 px-2">
        <img src="assets/icons/favicon.svg" alt="" class="size-9">
        <span class="leading-tight"><span class="block font-extrabold tracking-tight">Driving Teaching</span><span class="block text-xs text-slate-500 dark:text-slate-400">First lesson to test pass</span></span>
      </a>
      <nav class="mt-8 flex flex-col gap-1" data-nav="side"></nav>
      <div class="mt-auto space-y-3 border-t border-slate-200 pt-4 dark:border-slate-800" data-side-foot></div>
    </aside>

    <div class="min-w-0">
      <!-- Top bar -->
      <header class="sticky top-0 z-30 print:hidden border-b border-slate-200/80 bg-white/85 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
        <div class="mx-auto flex h-14 max-w-6xl items-center gap-2 px-4">
          <a href="#/" class="flex items-center gap-2 lg:hidden"><img src="assets/icons/favicon.svg" alt="" class="size-8"><span class="hidden font-extrabold tracking-tight min-[480px]:inline">Driving Teaching</span><span class="sr-only min-[480px]:hidden">Driving Teaching</span></a>
          <p class="hidden truncate text-sm font-semibold text-slate-500 lg:block dark:text-slate-400" data-crumb></p>
          <div class="ml-auto flex items-center gap-2" data-topbar></div>
        </div>
      </header>

      <main id="main" class="mx-auto max-w-6xl px-4 pb-28 pt-5 lg:pb-12" tabindex="-1" data-app>
        <noscript><p class="rounded-xl bg-amber-100 p-4 text-amber-900">This app needs JavaScript turned on.</p></noscript>
      </main>
    </div>
  </div>

  <!-- Bottom tab bar (phones and portrait tablets) -->
  <nav class="fixed inset-x-0 bottom-0 z-30 print:hidden border-t border-slate-200 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur lg:hidden dark:border-slate-800 dark:bg-slate-900/95" aria-label="Main navigation" data-nav="bottom"></nav>

  <div class="pointer-events-none fixed inset-x-0 bottom-24 z-50 flex justify-center px-4 lg:bottom-6" aria-live="polite"><p class="pointer-events-auto hidden rounded-full bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-lg dark:bg-white dark:text-slate-900" data-toast></p></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
